<!--
  R2 ships one script, and it is the menu.

  What was here in v1 and is deliberately gone: GSAP, ScrollTrigger and
  Lenis, pulled from three external CDNs, driving js/reveals.js (elements
  fade and translate up as they scroll into view) and js/smooth-scroll.js
  (scroll hijacking).

  Three reasons, and any one of them is sufficient:

  1. R2's motion language is decided and those are not it. "The site draws"
     — all motion is line-work drawing itself: the scroll cue, the link
     underlines, the Ajman map, this menu's wipe. No decorative fades, no
     parallax, no sliders, no bounce.
  2. Reduced motion must always show the finished state, and a reveal system
     that starts every element at opacity 0 is one broken script away from a
     blank page.
  3. This repository is handed over as a whole, once. Three external CDN
     dependencies in the chrome of a static site is a liability the handover
     should not carry.

  js/reveals.js, js/smooth-scroll.js and src/styles/animations.css are still
  in the tree and still work; nothing loads them. If a screen turns out to
  need one, it opts in through its own pageScript rather than every page
  paying for it.
-->

<script src="{{assetPrefix}}js/menu.js" defer></script>
{{#each pageScripts}}<script src="{{assetPrefix}}js/{{this}}.js" defer></script>{{/each}}
