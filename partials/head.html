<meta charset="UTF-8">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="Proarc">
<!-- og:url is DERIVED from the canonical in build/lib/seo.js, never
     authored beside it: two hand-written identities for one page is how
     they come to disagree. -->
<meta property="og:url" content="{{ogUrl}}">
<!-- Conditional: /ajman, Services, About, Contact and /careers carry no
     photograph by decision, and content="" is a broken tag rather than an
     absent one.

     ABSOLUTE, and that is the fix this partial used to carry a note asking
     for. All 53 pages that had an og:image shipped it as a page-relative
     path — "../images/projects/rosetower/hero-md.webp" — which no scraper
     can resolve from anywhere but the page itself. Every share card on the
     site was blank. build/lib/seo.js resolves it against the one origin,
     inside renderShell, so all fifty-eight routes take it from one place. -->
{{#if ogImageAbs}}<meta property="og:image" content="{{ogImageAbs}}">{{/if}}
<meta property="og:type" content="website">
<!-- A summary_large_image card with no image is a broken card, not a large
     one. The type follows what the page can actually offer. -->
<meta name="twitter:card" content="{{twitterCard}}">
<link rel="shortcut icon" href="{{assetPrefix}}images/ui/favicon.ico">

<!-- Structured data, opt-in per route (build/lib/seo.js). It carries what
     ProArc publishes about itself and what the records hold, and nothing
     else: no headcount (X9 bars it permanently), no project count (the
     no-numbers rule), no street address until X14 answers, no aggregate
     rating, and no SearchAction — the Work arrival's search runs in the
     browser over a build-made island and has no URL a crawler could query,
     so declaring the endpoint would advertise something that does not
     exist. Structured data is not a loophole in a copy rule. -->
{{#if jsonLd}}<script type="application/ld+json">{{jsonLd}}</script>{{/if}}
