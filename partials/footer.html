<!--
  The footer. Black ground with its own #333333 top hairline — on a paper
  page the closing band owns the switch and the footer shares the band's
  ground, so the two are separated by structure and scale, never by colour
  (E1.2a). On a page with no band the footer owns the switch itself (E1.2c).

  The line is the decided site-wide copy. Skyline is retired everywhere,
  the footer included (D-4): a skyline is towers, and it argues for the
  three offices rather than the twenty-seven schools and shops. The second
  sentence is X6-elastic — it names three disciplines, and ProArc's answer
  on the discipline list changes this sentence and the Services blocks
  together.

  This footer is /ajman's door on every page of the site, and its Ajman link
  is the one link here that must never break. It said "one of three doors (the
  other two are Home's map and About's story)" until 8 Aug and TWO of those
  three were fictional: About's body has never carried an /ajman link at all,
  and Home's map now reaches the filtered work sets on /projects instead. The
  real second door is the district link on project record pages
  (`pd-neighbours__restlink`), which nobody had counted. A door named in a
  comment and asserted nowhere is how a page comes to be reachable by one
  route while three are claimed. It also carries the marketing route to /careers, which is why the
  overlay refuses a careers item of its own.

  🔴 CORRECTED 9 Aug — the sentence above said "on EVERY project record page"
  and that was itself a door named in a comment and counted by nobody, in the
  clause written to stop exactly that. COUNTED: 17 of the 47 records carry a
  `pd-neighbours__restlink` into `../ajman.html#district-…` (6 Al Tallah, 6
  Al Jurf, 5 Al Zorah); the other 30 point at a sector page instead. So on 30
  record pages this footer is /ajman's ONLY door, which is the condition the
  8 Aug correction was written to remove — it replaced two fictional doors
  with a third overstated one. Still asserted nowhere.

  Deliberately NOT here, each a live v1 fault this replaces: the wordmark
  re-set as type in a <span class="brand">, a Testimonials item, "Projects"
  where the decided label is Work, v1's seven-item nav — the SET, Testimonials
  included, never the arithmetic (see the Home note below, which ships seven),
  the newsletter form posting to a contact.php that fatals on PHP 8, and six
  dead href="#" links of which three were the social row.
-->

<footer class="site-footer">
  <div class="site-footer__inner">

    <p class="site-footer__line">The buildings a city grows up in. Architecture, engineering and project management from one Ajman office.</p>

    <!--
      🔴 HOME IS FIRST, AND 09-menu §11's REFUSAL DOES NOT REACH THIS SURFACE
      (Mahesh, 9 Aug, reading the foot of /projects/homes.html: "if we go to
      the bottom of a page, then to go back to home, we now have to scroll all
      the way up to the logo").

      §11 refuses a Home nav item for two reasons — "the four-item lock" and
      "the wordmark (present in the overlay, field dissolved) is the Home
      door". Both are properties of the OVERLAY. The four-item lock is the
      overlay's (§10); this footer has always shipped six, two of them
      precisely because the overlay refuses them (see the /careers note
      above). And the wordmark is not here. A refusal can be exactly right
      about its object and wrong about its scope — this project has recorded
      that once already, in Session XXXIII.

      MEASURED, which is why this is a door and not a convenience. At the
      foot of every page at >=780 the html carries `chrome-quiet chrome-retired`
      TOGETHER: the plate is at translateY(-84.03) by the arrival rule and the
      trigger at -67.25 because the reader armed it by scrolling down here.
      Neither is in the viewport. Home doors on screen: ZERO, and the census
      says 57 of 58 pages carry their ONLY route to index.html on the plate —
      the one carrier the design deliberately removes. The route home from
      this band was: scroll up past the 24px hysteresis, press the trigger,
      click the wordmark. Three actions on desktop, two on mobile.

      SEVEN ITEMS, and the "seven" this file's own list below warns about is a
      SET, not a count: 00-Design-Continuity.md:389 records v1's as "the
      seven-item nav including Testimonials", beside "Projects" where the
      decided label is Work. Refusing a seventh item on the arithmetic would
      be the same wrong-scope move as applying §11 here. Measured with it in:
      one line at 1440, 1024, 780 and 500, and at a true 375 the list already
      wrapped to two with six items and stays at two with seven.

      NOT the wordmark, which was the first form tried and is barred by
      E13.2a's own sentence — "identity is made once per page and does not
      reintroduce itself over the argument" — the clause that made the plate
      retreat in the first place. A second mark at the foot of 58 pages is the
      literal thing it forbids.
    -->
    <nav class="site-footer__nav" aria-label="Footer">
      <ul class="site-footer__list">
        <li><a class="site-footer__link" href="{{assetPrefix}}index.html">Home</a></li>
        <li><a class="site-footer__link" href="{{assetPrefix}}projects.html">Work</a></li>
        <li><a class="site-footer__link" href="{{assetPrefix}}services.html">Services</a></li>
        <li><a class="site-footer__link" href="{{assetPrefix}}about.html">About</a></li>
        <li><a class="site-footer__link" href="{{assetPrefix}}contact.html">Contact</a></li>
        <li><a class="site-footer__link" href="{{assetPrefix}}ajman.html">Ajman</a></li>
        <li><a class="site-footer__link" href="{{assetPrefix}}careers.html">Careers</a></li>
      </ul>
    </nav>

    <!-- Two socials, both verified live. Twitter/X is cut site-wide: the
         handle is the CEO's personal account, not the practice's. -->
    <ul class="site-footer__social">
      <li><a class="site-footer__link" href="https://www.facebook.com/proarcarchitects/" rel="noopener">Facebook</a></li>
      <li><a class="site-footer__link" href="https://www.instagram.com/proarchitects/" rel="noopener">Instagram</a></li>
    </ul>

    <!--
      DIRECTIONS (Session XXXVII, Mahesh). Its own row rather than an extra
      item in the social list: that list is the accounts ProArc owns, and a
      route to a building is not one of them — appending it there would be
      the same naming fault as the "Address" label over a PO Box, one level
      down. Above the legal line because it is a door and the legal line
      closes the page.

      🔴 IT IS A MARK PLUS A WORD, never the mark alone. The two links
      directly above it ship as the WORDS Facebook and Instagram, where an
      icon is the universal convention — so a wordless pin here would be the
      one bare glyph on the site, in the company of the two places that most
      obviously refused one. About's ring-seals settled the same question the
      same way (07-about §13.5.4): a bare icon row loses the readable claim.

      And the mark is DRAWN, not Google's: §1.5a rule 3 bars a third-party
      mark from this ground outright, and this ground is black.
    -->
    <p class="site-footer__way">
      <a class="site-footer__link site-footer__waylink" href="{{directionsHref}}" rel="noopener">{{directionsMark}}<span>Directions</span></a>
    </p>

    <p class="site-footer__legal">&copy; 2026 Proarc</p>

  </div>
</footer>
