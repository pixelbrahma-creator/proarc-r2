<!--
  The site's chrome and its one navigation surface. Spec: 09-menu.md,
  amended by Board 17 (Session K, H1) — geometry, position and the field.

  Three things sit here, and the order below is the tab order: the trigger
  (top inline-start), the wordmark plate (top inline-end), and the overlay
  they open. C-1 is the decided arrangement — "the logo on one side and the
  three lines on the other" — and both corners flip in RTL by logical
  properties alone; the artwork never mirrors (§8).

  The band is grouped by FUNCTION: the start corner is the controls (the
  trigger — and the language switch beside it, when the bilingual build
  lands), the end corner is the identity, the mark alone. The chrome is NOT
  duplicated inside the overlay: it is one set of elements painted above it.

  The field is ONE rule again, and the plate has joined the trigger on it
  (E8.2 as amended 20 Aug 2026 — ProArc supplied both masters). Both halves
  of the chrome now ship FIELDED, the safe state, and js/chrome.js removes
  the field while the band under it holds nothing but paper. On black the
  two states are identical; photography returns the field (§8).

  🔴 THE PLATE CARRIES TWO IMG ELEMENTS AND CSS CHOOSES, BECAUSE §8 BARS
  DERIVING ONE FROM THE OTHER. A filter, a mask or a mix-blend-mode would
  recolour supplied artwork, which E8.4 forbids outright — so both masters
  are in the document and the ground decides which is painted. The white
  one is FIRST and unconditional: it is the shipped state, correct on the
  field, so a page whose script never runs is still legible.

  Only the white one carries the alt text. Two described images in one
  link makes a screen reader announce the destination twice.
-->

<button class="chrome-trigger" type="button"
        data-menu-trigger
        aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
  <span class="chrome-trigger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<!--
  The language switch's RESERVED SLOT (Board 17 §6): it renders here, in
  the controls corner beside the trigger, when the bilingual build lands —
  S-1, the target language in its own script. Nothing renders until then;
  an empty box is not shipped in the meantime (§9 rule 4). The overlay's
  old reserved slot is RETIRED — a switch in the band and a switch in the
  overlay is two sources for one control.
-->

<a class="chrome-plate" href="{{assetPrefix}}index.html">
  <img class="chrome-plate__mark chrome-plate__mark--on-dark"
       src="{{assetPrefix}}images/ui/logo-mark-white.webp"
       alt="Proarc — home"
       width="640" height="195" decoding="async">
  <img class="chrome-plate__mark chrome-plate__mark--on-paper"
       src="{{assetPrefix}}images/ui/logo-mark-black.webp"
       alt="" aria-hidden="true"
       width="640" height="195" decoding="async">
</a>

<!-- The nib: the white hairline that leads the wipe. Decoration, and it
     leaves the flow entirely when it is not running. -->
<span class="menu-nib" data-menu-nib aria-hidden="true"></span>

<div class="menu-overlay" id="site-menu" data-menu-overlay data-stage="{{menuRestStage}}" inert>
  <div class="menu-overlay__regions">

    <nav class="menu-nav" aria-label="Main">
      <ul class="menu-nav__list">
        {{#each navItems}}<li class="menu-nav__row"><a class="menu-nav__item{{navLitClass}}" href="{{navHref}}"{{navCurrentAttr}}{{navSwapAttr}}>{{navLabel}}</a></li>{{/each}}
      </ul>
    </nav>

    <!--
      The stage — G-4's swap, widened from two occupants to five (§4.4's
      own revision, taken 8 Aug). It holds ONE idea at a time and never
      two: WORK's preview, SERVICES' six blocks, ABOUT's line, CONTACT's
      three steps, and the resting line beneath them all.

      Every occupant ships in the document and CSS decides which is shown,
      so an overlay with no JavaScript is complete rather than empty. The
      swap itself stays instant — a transition on the occupant would
      compete with the open (§4 rule 1); the RAIL is what moves.

      The constellation that was the resting image until 8 Aug is gone from
      this surface by Mahesh's decision — §6 built it as ornament with no
      label, link or count, and it read as nothing to a reader who had not
      been told. /ajman keeps its map.
    -->
    <div class="menu-centre" data-menu-centre>
      {{preview}}
      {{stages}}
    </div>

    <div class="menu-contact">
      <a class="menu-contact__item" href="{{menuTel}}"><span dir="ltr">{{menuPhone}}</span></a>
      <a class="menu-contact__item" href="{{menuMailto}}"><span dir="ltr">{{menuEmail}}</span></a>
      <!--
        🔴 A THIRD ITEM, AND §8's OWN SENTENCE IS WHY IT IS ALLOWED TO BE
        HERE. The clause below fixes this region at two identifiers and says
        of the cut address line: "restoring a line here is a consolidation
        question, REOPENED EXPLICITLY — never a silent build decision."
        Mahesh reopened it explicitly on 9 Aug, naming this surface first:
        "in menu, contact us and in footer add a google map link for
        direction .. can be an icon".

        It is NOT the address line §8 cut. That line printed "13003, Ajman,
        UAE" — a PO Box wearing an address label on every page of the site,
        which is X14 in its live form. This prints no address at all: it is
        a door, labelled with what it does, keyed on ProArc's own published
        pin. The address itself still belongs to Contact's facts row alone.
      -->
      <a class="menu-contact__item menu-contact__item--way" href="{{directionsHref}}" rel="noopener">{{directionsMark}}<span>Directions</span></a>
      <!--
        The AR switch slot that lived here is RETIRED (Board 17 §6): the
        language switch belongs in the band, beside the trigger — see the
        reserved slot above. Two slots is two sources for one control, the
        same fault as the phone and email being hand-written here while
        Contact derived them from data/contact.json, which Session I closed.

        The address line is CUT and the cut is a decision (§8): v1's
        "13003, Ajman, UAE" is a PO Box wearing an address label on every
        page. Contact carries the full facts row. Restoring a line here is
        a consolidation question, never a silent build decision.
      -->
    </div>

  </div>
</div>
