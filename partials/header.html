<!--
  The site's chrome and its one navigation surface. Spec: 09-menu.md,
  amended by Board 17 (Session K, H1) — geometry, position and the field.

  Three things sit here, and the order below is the tab order: the trigger
  (top inline-start), the wordmark plate (top inline-end), and the overlay
  they open. C-1 is the decided arrangement — "the logo on one side and the
  three lines on the other" — and both corners flip in RTL by logical
  properties alone; the artwork never mirrors (§8).

  The band is grouped by FUNCTION: the start corner is the controls (the
  trigger — and the language switch beside it, when the bilingual build
  lands), the end corner is the identity, the mark alone. The chrome is NOT
  duplicated inside the overlay: it is one set of elements painted above it.

  The field is now two rules, not one (E13.2 as amended). The PLATE keeps a
  permanent #000000 field until the E8 ink master exists — the mark is
  artwork, and §8 bars deriving the inverted master with a filter. The
  TRIGGER ships fielded and js/chrome.js removes the field while the band
  holds clean paper; on black the two states are identical, and photography
  returns the field (§8).
-->

<button class="chrome-trigger" type="button"
        data-menu-trigger
        aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
  <span class="chrome-trigger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<!--
  The language switch's RESERVED SLOT (Board 17 §6): it renders here, in
  the controls corner beside the trigger, when the bilingual build lands —
  S-1, the target language in its own script. Nothing renders until then;
  an empty box is not shipped in the meantime (§9 rule 4). The overlay's
  old reserved slot is RETIRED — a switch in the band and a switch in the
  overlay is two sources for one control.
-->

<a class="chrome-plate" href="{{assetPrefix}}index.html">
  <img class="chrome-plate__mark"
       src="{{assetPrefix}}images/ui/logo-mark.webp"
       alt="Proarc — home"
       width="330" height="117" decoding="async">
</a>

<!-- The nib: the white hairline that leads the wipe. Decoration, and it
     leaves the flow entirely when it is not running. -->
<span class="menu-nib" data-menu-nib aria-hidden="true"></span>

<div class="menu-overlay" id="site-menu" data-menu-overlay inert>
  <div class="menu-overlay__regions">

    <nav class="menu-nav" aria-label="Main">
      <ul class="menu-nav__list">
        {{#each navItems}}<li class="menu-nav__row"><a class="menu-nav__item{{navLitClass}}" href="{{navHref}}"{{navCurrentAttr}}{{navSwapAttr}}>{{navLabel}}</a></li>{{/each}}
      </ul>
    </nav>

    <!--
      The centre holds one idea at a time (G-4, "the swap"): the
      constellation at rest, the preview while WORK is hovered or focused,
      never both. The swap is instant and has no animation of its own — a
      transition here would compete with the open.
    -->
    <div class="menu-centre" data-menu-centre>
      {{constellation}}
      {{preview}}
    </div>

    <div class="menu-contact">
      <a class="menu-contact__item" href="{{menuTel}}"><span dir="ltr">{{menuPhone}}</span></a>
      <a class="menu-contact__item" href="{{menuMailto}}"><span dir="ltr">{{menuEmail}}</span></a>
      <!--
        The AR switch slot that lived here is RETIRED (Board 17 §6): the
        language switch belongs in the band, beside the trigger — see the
        reserved slot above. Two slots is two sources for one control, the
        same fault as the phone and email being hand-written here while
        Contact derived them from data/contact.json, which Session I closed.

        The address line is CUT and the cut is a decision (§8): v1's
        "13003, Ajman, UAE" is a PO Box wearing an address label on every
        page. Contact carries the full facts row. Restoring a line here is
        a consolidation question, never a silent build decision.
      -->
    </div>

  </div>
</div>
