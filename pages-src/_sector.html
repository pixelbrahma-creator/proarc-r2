<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<!-- @include head -->
</head>
<body>
<!-- @include header -->

<!--
  The sector page — one template, three routes (schools · malls · homes).
  Spec: 03-work.md §4.2, "the exhibition". The tiers come straight from the
  D1 order field: the print is the set's first-ordered record, the studies
  its second and third, the catalogue the rest. Nothing here is ranked by
  hand — build/lib/work.js reads the order and this file lays it out.

  Ground: paper (E1). Nothing is set on a photograph; every caption is
  off-image (name links to the project, district only). The set's own noun
  goes unsaid in its rows — only the exception speaks (E10.2).
-->
<main id="main" class="wk">

  <nav class="wk-way wk-way--arrival container" aria-label="You are here">
    <a class="wk-way__back t-meta-label" href="{{backHref}}"><span aria-hidden="true">&larr;</span> All work</a>
    <span class="wk-way__sep" aria-hidden="true">&middot;</span>
    <span class="wk-way__here t-meta-label">{{sectorNoun}}</span>
  </nav>

  {{#each print}}
  <figure class="wk-print container">
    <img class="wk-plate__img" src="{{plateSrc}}"{{#if plateSrcset}} srcset="{{plateSrcset}}" sizes="(max-width: 1200px) 100vw, 1120px"{{/if}}
         width="{{plateWidth}}" height="{{plateHeight}}" alt="{{plateName}}" fetchpriority="high" decoding="async">
    <figcaption class="wk-plate__caption">
      <a class="wk-plate__name t-meta-value" href="{{plateHref}}">{{plateName}}</a>{{#if plateProvenance}}<span class="wk-plate__genre">{{plateProvenance}}</span>{{/if}}{{#if platePlace}}<span class="wk-plate__place t-caption">{{platePlace}}</span>{{/if}}
    </figcaption>
  </figure>
  {{/each}}

  <header class="wk-head container">
    <h1 class="wk-verb t-editorial">{{sectorVerb}}</h1>
    <p class="wk-support t-body-lg">{{sectorSupport}}</p>
  </header>

  <div class="wk-studies container">
    {{#each studies}}
    <figure class="wk-study">
      <img class="wk-plate__img" src="{{plateSrc}}"{{#if plateSrcset}} srcset="{{plateSrcset}}" sizes="(max-width: 820px) 100vw, 560px"{{/if}}
           width="{{plateWidth}}" height="{{plateHeight}}" alt="{{plateName}}" loading="lazy" decoding="async">
      <figcaption class="wk-plate__caption">
        <a class="wk-plate__name t-meta-value" href="{{plateHref}}">{{plateName}}</a>{{#if plateProvenance}}<span class="wk-plate__genre">{{plateProvenance}}</span>{{/if}}{{#if platePlace}}<span class="wk-plate__place t-caption">{{platePlace}}</span>{{/if}}
      </figcaption>
    </figure>
    {{/each}}
  </div>

  <!--
    The catalogue, as the band (7 Aug). It was quiet rows beside a standing
    photograph frame — sticky, hover-driven, defaulting to the first record —
    with a small inline thumbnail replacing the frame below 1024 or on a
    coarse pointer. Both are gone: the band gives every record its own
    photograph at every width, so a single frame showing one record at a time
    has nothing left to do, and the capability query that chose between them
    has nothing left to choose.

    🔴 WHAT STAYS ABOVE THIS IS THE POINT. The print and the two studies are
    not a leftover — they are the only countable difference between this page
    and the arrival's room, which carries the identical set (15 records here,
    15 in Learns). Three records render above 500px here and none do there.
    Delete them and this page becomes a strict subset of one room of
    /projects, which is exactly why /projects/list was deleted.
  -->
  <section class="wk-catalogue container" aria-label="All {{sectorNoun}}">
    {{catalogueBandHtml}}
  </section>

  <p class="wk-also container">{{alsoHtml}}</p>

  <!-- The closing band. E1.2 — the inverse of this paper page; E1.2a — nothing
       sits between it and the footer, which share this ground. -->
  <section class="wk-band surface-dark" aria-label="Start a project">
    <div class="container">
      <p class="wk-band__line">Have a project in mind? Let&rsquo;s talk.</p>
      <a class="wk-band__action" href="{{assetPrefix}}contact.html">Contact</a>
    </div>
  </section>

</main>

<!-- @include footer -->
<!-- @include scripts -->
</body>
</html>
