name: Stylelint

on:
  push:
    paths:
      - "src/**/*.css"
      - ".stylelintrc.json"
      - ".github/workflows/stylelint.yml"
  pull_request:
    paths:
      - "src/**/*.css"
      - ".stylelintrc.json"
      - ".github/workflows/stylelint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint:css
