name: Stylelint

on:
  push:
    paths:
      - "src/**/*.css"
      - ".stylelintrc.json"
      - ".github/workflows/stylelint.yml"
      # The gate installs with `npm ci`, so what it installs is part of the
      # gate. Without these two the job cannot re-prove itself after a
      # dependency change — and it spent its whole life red for exactly that
      # reason: package-lock.json was never committed, so `npm ci` failed at
      # EUSAGE on every push and the lint step was never once reached.
      - "package-lock.json"
      - "package.json"
  pull_request:
    paths:
      - "src/**/*.css"
      - ".stylelintrc.json"
      - ".github/workflows/stylelint.yml"
      # The gate installs with `npm ci`, so what it installs is part of the
      # gate. Without these two the job cannot re-prove itself after a
      # dependency change — and it spent its whole life red for exactly that
      # reason: package-lock.json was never committed, so `npm ci` failed at
      # EUSAGE on every push and the lint step was never once reached.
      - "package-lock.json"
      - "package.json"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint:css
